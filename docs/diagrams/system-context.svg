<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <title>System Context — Bray-Ali Formalization</title>
  <rect width="900" height="480" fill="#f8f9fa"/>
  <text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a365d">System Context: Bray-Ali Four-State Proton Model Formalization</text>
  
  <!-- Core Lean -->
  <rect x="320" y="160" width="260" height="120" rx="8" fill="#1a365d" stroke="#2c5282" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">Lean 4 Core</text>
  <text x="450" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">BrayAliModel.lean</text>
  <text x="450" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">LevyModel.lean</text>
  <text x="450" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">RKernels.lean</text>
  
  <!-- Wolfram -->
  <rect x="40" y="80" width="180" height="70" rx="6" fill="#2c7a7b" stroke="#234e52"/>
  <text x="130" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Wolfram / Mathematica</text>
  <text x="130" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e6fffa">brayali.wl + QE</text>
  
  <!-- R -->
  <rect x="40" y="280" width="180" height="70" rx="6" fill="#744210" stroke="#5f370e"/>
  <text x="130" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">R Diagnostics</text>
  <text x="130" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fefcbf">levy_diagnostics.R</text>
  
  <!-- ACL2 / Racket / C -->
  <rect x="680" y="80" width="180" height="70" rx="6" fill="#2a4365" stroke="#2c5282"/>
  <text x="770" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">ACL2 + GL</text>
  <text x="770" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bee3f8">parr-aes.lisp</text>
  
  <rect x="680" y="180" width="180" height="70" rx="6" fill="#2a4365" stroke="#2c5282"/>
  <text x="770" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Racket Port</text>
  <text x="770" y="228" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bee3f8">parr-math.rkt</text>
  
  <rect x="680" y="280" width="180" height="70" rx="6" fill="#2a4365" stroke="#2c5282"/>
  <text x="770" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Native C</text>
  <text x="770" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#bee3f8">gf256.c (ParrMath)</text>
  
  <!-- Arrows -->
  <line x1="220" y1="115" x2="320" y2="200" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="315" x2="320" y2="240" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="200" x2="680" y2="115" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="220" x2="680" y2="215" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="240" x2="680" y2="315" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  
  <text x="450" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a5568">All components formalize or numerically check the same mathematical model. Lean is the primary mechanized artifact.</text>
</svg>
