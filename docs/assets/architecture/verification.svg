<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <title>System Architecture</title>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a202c">System Architecture — Bray-Ali Formalization</text>
  <rect x="300" y="140" width="400" height="180" rx="6" fill="#1a365d" stroke="#2a4365"/>
  <text x="500" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">Lean 4 Core (Init only)</text>
  <text x="500" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">BrayAliModel.lean — Hamiltonian & bounds</text>
  <text x="500" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">LevyModel.lean — Innovation interface</text>
  <text x="500" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">RKernels.lean — Diagnostic kernels</text>
  <text x="500" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e2e8f0">AesGF256.lean — GF(2⁸) cross-check</text>
  <rect x="40" y="60" width="200" height="60" rx="4" fill="#2c7a7b"/>
  <text x="140" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Wolfram reference</text>
  <rect x="40" y="360" width="200" height="60" rx="4" fill="#744210"/>
  <text x="140" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">R diagnostics</text>
  <rect x="760" y="60" width="200" height="60" rx="4" fill="#2a4365"/>
  <text x="860" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">ACL2 + GL</text>
  <rect x="760" y="160" width="200" height="60" rx="4" fill="#2a4365"/>
  <text x="860" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Racket port</text>
  <rect x="760" y="260" width="200" height="60" rx="4" fill="#2a4365"/>
  <text x="860" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Native C (gf256)</text>
  <line x1="240" y1="90" x2="300" y2="180" stroke="#4a5568" stroke-width="1.2"/>
  <line x1="240" y1="390" x2="300" y2="280" stroke="#4a5568" stroke-width="1.2"/>
  <line x1="700" y1="180" x2="760" y2="90" stroke="#4a5568" stroke-width="1.2"/>
  <line x1="700" y1="220" x2="760" y2="190" stroke="#4a5568" stroke-width="1.2"/>
  <line x1="700" y1="260" x2="760" y2="290" stroke="#4a5568" stroke-width="1.2"/>
  <text x="500" y="490" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5568">Lean is the primary machine-checked artifact. Other languages supply independent numerical or bit-blasted checks of the same mathematics.</text>
</svg>
