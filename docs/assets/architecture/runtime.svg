<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <title>Mathematical Data Flow</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Mathematical Data Flow</text>
  <rect x="40" y="80" width="140" height="50" rx="4" fill="#1a365d"/><text x="110" y="110" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">ham4</text>
  <rect x="220" y="80" width="140" height="50" rx="4" fill="#1a365d"/><text x="290" y="110" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">dark eigenvector</text>
  <rect x="400" y="80" width="140" height="50" rx="4" fill="#1a365d"/><text x="470" y="110" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">ham3 / secular</text>
  <rect x="580" y="80" width="140" height="50" rx="4" fill="#1a365d"/><text x="650" y="110" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">eps bounds</text>
  <rect x="760" y="80" width="120" height="50" rx="4" fill="#2c7a7b"/><text x="820" y="110" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">p_rare</text>
  <line x1="180" y1="105" x2="220" y2="105" stroke="#4a5568" marker-end="url(#a)"/>
  <line x1="360" y1="105" x2="400" y2="105" stroke="#4a5568" marker-end="url(#a)"/>
  <line x1="540" y1="105" x2="580" y2="105" stroke="#4a5568" marker-end="url(#a)"/>
  <line x1="720" y1="105" x2="760" y2="105" stroke="#4a5568" marker-end="url(#a)"/>
  <rect x="220" y="200" width="160" height="50" rx="4" fill="#744210"/><text x="300" y="230" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">innovation dW</text>
  <rect x="420" y="200" width="160" height="50" rx="4" fill="#744210"/><text x="500" y="230" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">QV / martingale</text>
  <rect x="620" y="200" width="160" height="50" rx="4" fill="#744210"/><text x="700" y="230" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">z-scores / KS</text>
  <line x1="380" y1="225" x2="420" y2="225" stroke="#4a5568" marker-end="url(#a)"/>
  <line x1="580" y1="225" x2="620" y2="225" stroke="#4a5568" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#4a5568"/></marker></defs>
  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5568">Upper path: algebraic reduction. Lower path: stochastic diagnostics on the innovation process.</text>
</svg>
